  <linearGradient id="orange" x1="394" y1="548" x2="680" y2="572" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFD18E"/><stop offset=".45" stop-color="#FFAE81"/><stop offset="1" stop-color="#FF7D92"/></linearGradient>
  <linearGradient id="tileEdge" x1="130" y1="90" x2="900" y2="900" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF" stop-opacity=".23"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".065"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".12"/></linearGradient>
