<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <linearGradient id="tile" x1="0.08" y1="0" x2="0.95" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#243246"/><stop offset="0.43" stop-color="#151D32"/><stop offset="1" stop-color="#171229"/></linearGradient>
  <radialGradient id="light1" cx="0" cy="0" r="1" gradientTransform="translate(275 214) rotate(42) scale(610 660)" gradientUnits="userSpaceOnUse"><stop stop-color="#61D6D5" stop-opacity=".16"/><stop offset="1" stop-color="#61D6D5" stop-opacity="0"/></radialGradient>
  <radialGradient id="light2" cx="0" cy="0" r="1" gradientTransform="translate(755 770) rotate(50) scale(480 550)" gradientUnits="userSpaceOnUse"><stop stop-color="#A077FF" stop-opacity=".17"/><stop offset="1" stop-color="#A077FF" stop-opacity="0"/></radialGradient>
