<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentFabric</title>
    <!-- The app icon, in the browser tab and in a plain browser window.
         Both files are copied from `assets/` (the same drawing the macOS
         .icns is exported from), so the tab, the window and the Dock agree. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <!-- Declares the theme the stylesheet uses (light). Said here as well so
         form controls and scrollbars are painted correctly on the first frame,
         before the stylesheet arrives. -->
    <meta name="color-scheme" content="light" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
